<script>
    /*se necesita escribirr que el programa solicite 
    al usuario el ingeso de un numero y el sistema mostrara
    en etiquetas H1 los numeros en forma descendente hasta el 0*/

 var numero = prompt ("ingrese un numero");

for (let index = (numero); index >= 0; index--) {
    document.write(`<h1>${index}</h1>`);
}
