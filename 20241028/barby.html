<script>
    /* 
se necesita que el usuario ingrse un numeero y
el sistema mostrara todos los numeros desde el 0 al numero ingresado
    */

var numero = prompt("pon un numero");
 /* estructura bucle FOR*/
for (let index = 0;  /* paso 1) variable de control*/
    index <= numero; /*paso 2)validacion de condicion*/
    index = index + 1 )  /*paso 4) incremento de la variable de control para no tener un bucle infinito*/
{ 
    document.write(index); /*paso 3) si el paso 2 = verdadero entonces ejecutamos el bloque, de lo contrario el bucle finaliza*/
}













</script>
